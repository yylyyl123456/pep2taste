name: Keep Pep2Taste Awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pep2taste-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping Streamlit frontend
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --location \
            --silent \
            --show-error \
            --output /tmp/pep2taste_frontend.out \
            --max-time 120 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            "https://cqu-pep2taste.streamlit.app/~/+/_stcore/health"
          cat /tmp/pep2taste_frontend.out
          echo "Streamlit frontend is healthy."

      - name: Ping Hugging Face backend health endpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::The HF_TOKEN repository secret is not configured."
            exit 1
          fi

          curl --fail-with-body \
            --location \
            --silent \
            --show-error \
            --output /tmp/pep2taste_backend.out \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            --connect-timeout 30 \
            --max-time 300 \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 20 \
            "https://yylcqu123-pep2taste-api.hf.space/health"
          cat /tmp/pep2taste_backend.out
          echo "Hugging Face backend is healthy."
