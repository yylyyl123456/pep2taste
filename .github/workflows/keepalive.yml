name: Keep Pep2Taste Awake

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keepalive.yml"

permissions:
  contents: read

concurrency:
  group: pep2taste-keepalive
  cancel-in-progress: true

jobs:
  streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake and verify Streamlit frontend
        run: |
          set -uo pipefail

          frontend_url="https://cqu-pep2taste.streamlit.app/"
          health_url="https://cqu-pep2taste.streamlit.app/~/+/_stcore/health"
          cookie_jar="/tmp/pep2taste_streamlit.cookies"
          : > "${cookie_jar}"

          for attempt in $(seq 1 12); do
            echo "Streamlit wake check ${attempt}/12"

            # A request to the app page counts as real frontend traffic and can
            # wake a sleeping Community Cloud app. The health endpoint alone
            # may return an error without starting the app.
            curl --location \
              --silent \
              --show-error \
              --output /dev/null \
              --cookie "${cookie_jar}" \
              --cookie-jar "${cookie_jar}" \
              --connect-timeout 30 \
              --max-time 90 \
              --user-agent "Mozilla/5.0 Pep2Taste-Keepalive/1.0" \
              "${frontend_url}" || true

            if curl --fail-with-body \
              --location \
              --silent \
              --show-error \
              --output /tmp/pep2taste_frontend.out \
              --cookie "${cookie_jar}" \
              --cookie-jar "${cookie_jar}" \
              --connect-timeout 30 \
              --max-time 60 \
              "${health_url}"; then
              cat /tmp/pep2taste_frontend.out
              echo "Streamlit frontend is healthy."
              exit 0
            fi

            if [[ "${attempt}" -lt 12 ]]; then
              sleep 30
            fi
          done

          echo "::error::Streamlit did not become healthy after repeated wake attempts."
          exit 1

  hugging-face:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping Hugging Face backend health endpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::The HF_TOKEN repository secret is not configured."
            exit 1
          fi

          curl --fail-with-body \
            --location \
            --silent \
            --show-error \
            --output /tmp/pep2taste_backend.out \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            --connect-timeout 30 \
            --max-time 300 \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 20 \
            "https://yylcqu123-pep2taste-api.hf.space/health"
          cat /tmp/pep2taste_backend.out
          echo "Hugging Face backend is healthy."
